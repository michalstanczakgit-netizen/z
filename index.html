<script>
(() => {
  "use strict";

  const GAME_WORDS = [
    "YAROI", "RANCHER", "ASHLEY", "KUROYAMI", "GWIAZDKI", 
    "ELITA", "VECTOR", "STORM", "SKRADANIE", "SAMURAJ", 
    "JAPONIA", "STANY", "GRZECZNY", "OCZY", "HARACZ", 
    "PORWANIA", "KARABIN", "PYTANIE", "TELEWIZOR", "DECYZJE", 
    "ZAGADKI", "KATANA", "RONIN"
  ];

  const TARGET_STREAK = 5;
  const START_TIME = 60;
  const TIME_PENALTY = 10;
  const TIME_BONUS = 5;
  const ADMIN_PASS = "19122005";

  let currentWord = "";
  let streak = 0;
  let timeLeft = START_TIME;
  let timerInterval = null;
  let isPlaying = false;

  // Admin state
  let freezeTime = false;

  // DOM Elements
  const timerVal = document.getElementById("timerVal");
  const progressVal = document.getElementById("progressVal");
  const hexDisplay = document.getElementById("hexDisplay");
  const decodeInput = document.getElementById("decodeInput");
  const submitBtn = document.getElementById("submitBtn");
  const terminalLog = document.getElementById("terminalLog");
  const cheatGrid = document.getElementById("cheatGrid");
  const cheatTitle = document.getElementById("cheatTitle");

  const startScreen = document.getElementById("startScreen");
  const loseScreen = document.getElementById("loseScreen");
  const winScreen = document.getElementById("winScreen");
  const adminAuthScreen = document.getElementById("adminAuthScreen");
  const adminPanelScreen = document.getElementById("adminPanelScreen");

  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");
  const playAgainBtn = document.getElementById("playAgainBtn");

  // Admin UI
  const adminBtn = document.getElementById("adminBtn");
  const adminPassInput = document.getElementById("adminPassInput");
  const adminLoginBtn = document.getElementById("adminLoginBtn");
  const closeAdminAuthBtn = document.getElementById("closeAdminAuthBtn");
  const closeAdminPanelBtn = document.getElementById("closeAdminPanelBtn");
  const adminAuthMsg = document.getElementById("adminAuthMsg");
  const freezeTimeToggle = document.getElementById("freezeTimeToggle");
  const revealAnsBtn = document.getElementById("revealAnsBtn");
  const addProgressBtn = document.getElementById("addProgressBtn");

  // Generowanie tabeli ASCII
  function renderCheatSheet(shuffle = false) {
    let chars = [];
    for (let i = 65; i <= 90; i++) {
      chars.push({ char: String.fromCharCode(i), hex: i.toString(16).toUpperCase() });
    }

    if (shuffle) {
      // Algorytm Fisher-Yates do miksowania kolejności
      for (let i = chars.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [chars[i], chars[j]] = [chars[j], chars[i]];
      }
      cheatTitle.textContent = "TABELA ASCII (LOSOWA KOLEJNOŚĆ!)";
      cheatTitle.style.color = "#ff5566";
    } else {
      cheatTitle.textContent = "TABELA ASCII (A-Z)";
      cheatTitle.style.color = "var(--gold-soft)";
    }

    cheatGrid.innerHTML = "";
    chars.forEach(item => {
      const el = document.createElement("div");
      el.className = "cheat-item";
      el.innerHTML = `${item.char}=<span>${item.hex}</span>`;
      cheatGrid.appendChild(el);
    });
  }

  function textToHex(text) {
    return text.split("")
      .map(c => c.charCodeAt(0).toString(16).toUpperCase())
      .join(" ");
  }

  function addLog(msg, type = "info") {
    const p = document.createElement("p");
    p.className = `log-entry log-${type}`;
    p.textContent = `> ${msg}`;
    terminalLog.appendChild(p);
    terminalLog.scrollTop = terminalLog.scrollHeight;
  }

  function nextWord() {
    const available = GAME_WORDS.filter(w => w !== currentWord);
    currentWord = available[Math.floor(Math.random() * available.length)];
    hexDisplay.textContent = textToHex(currentWord);
    decodeInput.value = "";
    decodeInput.focus();

    // ZMIANA: Tabela miesza się po ukończeniu 2 haseł (streak >= 2)
    if (streak >= 2) {
      renderCheatSheet(true);
      addLog("WYKRYTO ZAKŁÓCENIA: Układ tabeli ASCII został zmieniony!", "error");
    } else {
      renderCheatSheet(false);
    }
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!freezeTime && isPlaying) {
        timeLeft--;
        timerVal.textContent = timeLeft + "s";
        if (timeLeft <= 0) {
          endGame(false, "Przekroczono limit czasu!");
        }
      }
    }, 1000);
  }

  function startGame() {
    isPlaying = true;
    streak = 0;
    timeLeft = START_TIME;
    timerVal.textContent = timeLeft + "s";
    progressVal.textContent = `${streak}/${TARGET_STREAK}`;
    terminalLog.innerHTML = "";
    addLog("Terminal gotowy. Rozpocznij odkodowywanie.", "info");

    startScreen.classList.add("hidden");
    loseScreen.classList.add("hidden");
    winScreen.classList.add("hidden");
    adminAuthScreen.classList.add("hidden");
    adminPanelScreen.classList.add("hidden");

    nextWord();
    startTimer();
  }

  function endGame(win, reason = "") {
    isPlaying = false;
    clearInterval(timerInterval);
    if (win) {
      winScreen.classList.remove("hidden");
    } else {
      document.getElementById("loseReason").textContent = reason;
      loseScreen.classList.remove("hidden");
    }
  }

  function checkAnswer() {
    if (!isPlaying) return;
    const val = decodeInput.value.trim().toUpperCase();
    if (!val) return;

    if (val === currentWord) {
      streak++;
      timeLeft += TIME_BONUS;
      timerVal.textContent = timeLeft + "s";
      progressVal.textContent = `${streak}/${TARGET_STREAK}`;
      addLog(`Poprawnie: ${val} (+${TIME_BONUS}s bonus!)`, "success");
      
      if (streak >= TARGET_STREAK) {
        endGame(true);
      } else {
        nextWord();
      }
    } else {
      timeLeft = Math.max(0, timeLeft - TIME_PENALTY);
      timerVal.textContent = timeLeft + "s";
      addLog(`BŁĄD: Niepoprawne słowo! Kara: -${TIME_PENALTY}s`, "error");
      decodeInput.value = "";
      if (timeLeft <= 0) {
        endGame(false, "Utrata stabilności połączenia z powodu błędów.");
      }
    }
  }

  // Event Listeners
  submitBtn.addEventListener("click", checkAnswer);
  decodeInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkAnswer();
  });

  startBtn.addEventListener("click", startGame);
  restartBtn.addEventListener("click", startGame);
  playAgainBtn.addEventListener("click", startGame);

  // Admin Events
  adminBtn.addEventListener("click", () => {
    if (isPlaying) {
      adminAuthMsg.textContent = "";
      adminPassInput.value = "";
      adminAuthScreen.classList.remove("hidden");
    }
  });

  adminLoginBtn.addEventListener("click", () => {
    if (adminPassInput.value === ADMIN_PASS) {
      adminAuthScreen.classList.add("hidden");
      adminPanelScreen.classList.remove("hidden");
    } else {
      adminAuthMsg.textContent = "Błędne hasło!";
    }
  });

  closeAdminAuthBtn.addEventListener("click", () => {
    adminAuthScreen.classList.add("hidden");
  });

  closeAdminPanelBtn.addEventListener("click", () => {
    adminPanelScreen.classList.add("hidden");
  });

  freezeTimeToggle.addEventListener("change", (e) => {
    freezeTime = e.target.checked;
  });

  revealAnsBtn.addEventListener("click", () => {
    addLog(`[ADMIN] Ukryte słowo: ${currentWord}`, "info");
  });

  addProgressBtn.addEventListener("click", () => {
    streak++;
    progressVal.textContent = `${streak}/${TARGET_STREAK}`;
    addLog("[ADMIN] Dodano postęp.", "info");
    if (streak >= TARGET_STREAK) {
      endGame(true);
    } else {
      nextWord();
    }
  });

  renderCheatSheet(false);
})();
</script>
